<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Security: only this site, Supabase, Google Fonts and (if set) Google Analytics can be used by the page -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://*.googletagmanager.com https://tagmanager.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://tagmanager.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co https://*.googletagmanager.com https://*.google-analytics.com https://www.google.com https://stats.g.doubleclick.net https://ssl.gstatic.com https://www.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://www.google.com https://stats.g.doubleclick.net; frame-src https://*.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hang your wish · TP Wish Tree 2026</title>
<meta name="description" content="Write a Christmas wish and hang it on the shared TP Malaysia and Thailand wish tree.">
<meta name="theme-color" content="#CFC3B0">
<link rel="icon" type="image/png" href="assets/tp-logo-white.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Sans:wght@300;400;500;700&family=Noto+Sans+Thai:wght@300;400;500;700&family=Noto+Sans+SC:wght@300;400;700&family=Noto+Sans+JP:wght@300;400;700&family=Noto+Sans+KR:wght@300;400;700&family=Noto+Sans+Tamil:wght@300;400;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'TP Sans';font-weight:300;font-display:swap;src:local('TP Sans Light'),local('TPSans-Light'),url('fonts/TPSans-Light.ttf') format('truetype')}
@font-face{font-family:'TP Sans';font-weight:400;font-display:swap;src:local('TP Sans'),local('TPSans-Regular'),url('fonts/TPSans-Regular.ttf') format('truetype')}
@font-face{font-family:'TP Sans';font-weight:500;font-display:swap;src:local('TP Sans Medium'),local('TPSans-Medium'),url('fonts/TPSans-Medium.ttf') format('truetype')}
@font-face{font-family:'TP Sans';font-weight:700;font-display:swap;src:local('TP Sans Bold'),local('TPSans-Bold'),url('fonts/TPSans-Bold.ttf') format('truetype')}

:root{
  /* Campaign colours: Spruce, Pine, Brass, Cranberry, Eggnog. Page is Eggnog, writing is Cranberry. */
  --spruce:#343F37; --pine:#736E52; --brass:#B18854; --cran:#6C151E; --eggnog:#CFC3B0;
  --bg:#CFC3B0; --bg-2:#C7BAA5;
  --cream:#6C151E; --cream-2:#5B3A33; --paper:#F4EEE3; --paper-2:#E9E0D0;
  --gold:#674A20;
  --ink:#343F37; --slate:#5A5550; --field:#B9AE99; --field-off:#D8CEBD; --focus:#0E6E63;
  --font:'TP Sans','Noto Sans','Noto Sans Thai',Calibri,system-ui,sans-serif;
  --script:'Great Vibes',cursive;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--cream);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[hidden]{display:none !important}

.app{position:relative;max-width:480px;min-height:100vh;min-height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}

/* top bar */
.bar{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px 0;padding-top:max(14px, env(safe-area-inset-top))}
.bar-left{display:flex;align-items:center;gap:10px;min-height:36px}
.logo{height:28px;width:auto;display:block}
.bar-name{font-size:14px;font-weight:500;color:var(--cream)}
.langs{display:flex;gap:4px;padding:3px;border-radius:999px;background:rgba(108,21,30,.08)}
.langs button{min-width:48px;min-height:36px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:var(--cream);font-size:14px;font-weight:500;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--cran);color:var(--paper)}

.view{position:relative;flex:1;display:flex;flex-direction:column}
.view h1{margin:0;font-weight:300;line-height:1.15}
.view h1:focus{outline:none}

/* hero */
.hero{position:relative;display:flex;flex-direction:column;gap:10px;padding:24px 24px 28px}
.hero .script{font-family:var(--script);font-size:40px;line-height:1;color:var(--gold)}
.hero h1{font-size:30px;color:var(--cream)}
.hero p{margin:0;font-size:15px;line-height:1.5;font-weight:400;color:var(--cream-2)}
.arc{position:absolute;border-radius:50%;pointer-events:none}
.arc-1{right:-150px;top:-140px;width:360px;height:360px;border:1px solid rgba(108,21,30,.14)}
.arc-2{right:-180px;top:160px;width:380px;height:380px;background:var(--bg-2)}

/* progress */
.progress{display:flex;align-items:center;gap:12px}
.back{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin-left:-10px;border:0;border-radius:50%;background:transparent;color:var(--cream);cursor:pointer}
.back:hover{background:rgba(108,21,30,.08)}
.progress-main{flex:1;display:flex;flex-direction:column;gap:6px}
.step-label{font-size:12px;font-weight:500;letter-spacing:.12em;color:var(--gold)}
.bars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.bars span{height:4px;border-radius:2px;background:rgba(108,21,30,.18)}
.bars span.on{background:var(--cran)}

/* form sheet */
.sheet{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;gap:22px;padding:24px 20px 32px;padding-bottom:max(32px, env(safe-area-inset-bottom));border-radius:24px 24px 0 0;background:var(--paper);color:var(--ink)}
.sheet fieldset{margin:0;padding:0;border:0;min-width:0}
.sheet legend,.sheet .label{padding:0;margin-bottom:10px;font-size:15px;font-weight:700;color:var(--ink)}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field label{font-size:15px;font-weight:700}
.field.small label{font-size:13px;font-weight:700}
.input,.select,.textarea{width:100%;min-width:0;border:1.5px solid var(--field);border-radius:12px;background:#fff;color:var(--ink);font-size:16px}
.input,.select{height:52px;padding:0 16px}
.select{padding:0 12px}
.textarea{padding:14px 16px;line-height:1.45;resize:none}
.input:focus,.select:focus,.textarea:focus{border-color:var(--cran);outline:none;box-shadow:0 0 0 3px rgba(108,21,30,.18)}
.input[aria-invalid="true"]{border-color:#8E1F2A}
.input[readonly]{background:var(--paper-2);color:var(--slate)}
.input.digits{letter-spacing:.1em;font-variant-numeric:tabular-nums}
.help{font-size:13px;line-height:1.45;color:var(--slate)}
.err{margin:0;padding:10px 12px;border-radius:10px;background:#F3DADC;color:#6C151E;font-size:14px;line-height:1.45}
.err:empty{display:none}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;padding:0 20px;border:0;border-radius:999px;font-size:17px;font-weight:700;text-decoration:none;cursor:pointer}
.btn-dark,.btn-gold{background:var(--cran);color:var(--paper)}
.btn-dark:hover,.btn-gold:hover{background:#85202A}
.btn-line{min-height:52px;border:1px solid rgba(108,21,30,.4);background:transparent;color:var(--cream);font-weight:500;font-size:16px}
.btn-line:hover{background:rgba(108,21,30,.06)}
.btn[disabled]{opacity:.6;cursor:progress}
.link{min-height:44px;padding:0;border:0;background:transparent;color:var(--cran);font-size:14px;font-weight:500;text-decoration:underline;cursor:pointer;align-self:flex-start}

.privacy{display:flex;align-items:flex-start;gap:10px;font-size:12px;line-height:1.5;color:var(--slate)}
.privacy svg{flex:none;margin-top:1px}

/* your wish already on the tree */
.mine{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:12px;background:#F7E9D6;border:1px solid rgba(108,21,30,.2);font-size:14px;line-height:1.45;color:var(--ink)}
.mine-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mine-top b{color:var(--cran)}
.status{flex:none;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#E6DCCB;color:var(--ink)}
.status[data-s="approved"]{background:#DDE6DA;color:#25402D}
.status[data-s="rejected"]{background:#F3DADC;color:#6C151E}
.mine .link{min-height:32px;font-size:13px}

/* write view */
.opt-grid{display:grid;gap:10px}
.opt-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt-grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.opt{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 12px;border:1.5px solid var(--field-off);border-radius:12px;background:#fff;color:var(--ink);font-size:14px;font-weight:500;cursor:pointer;text-align:left}
.opt[aria-pressed="true"]{border:2px solid var(--cran);box-shadow:0 0 0 2px rgba(108,21,30,.08)}
.opt .sw{flex:none;width:22px;height:28px;border-radius:3px 3px 4px 4px;box-shadow:inset 0 0 0 1px rgba(52,63,55,.2)}
.opt.charm{flex-direction:column;justify-content:center;gap:4px;min-height:66px;padding:6px 4px;color:var(--cran);text-align:center}
.opt.charm span{font-size:12px;font-weight:400;color:var(--slate)}
.starters{display:flex;flex-wrap:wrap;gap:8px}
.starters button{min-height:36px;padding:0 14px;border:1px solid var(--field);border-radius:999px;background:transparent;color:var(--ink);font-size:13px;cursor:pointer}
.starters button:hover{background:var(--paper-2)}
.field-foot{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;font-size:12px;color:var(--slate)}
.counter{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.warn{color:#8A3A10;font-weight:500;line-height:1.45}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:40px;padding:0 14px;border:1px solid rgba(52,63,55,.2);border-radius:999px;background:var(--paper-2);color:var(--ink);font-size:14px;font-weight:500;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--cran);border-color:var(--cran);color:var(--paper)}
:lang(zh){font-family:'Noto Sans SC','Noto Sans',system-ui,sans-serif}
:lang(ja){font-family:'Noto Sans JP','Noto Sans',system-ui,sans-serif}
:lang(ko){font-family:'Noto Sans KR','Noto Sans',system-ui,sans-serif}
:lang(ta){font-family:'Noto Sans Tamil','Noto Sans',system-ui,sans-serif}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.about{display:flex;flex-direction:column;gap:14px}
.rules{display:flex;gap:12px;padding:14px 16px;border-radius:12px;background:var(--paper-2);font-size:13px;line-height:1.5}
.rules svg{flex:none;margin-top:1px}
.check{display:flex;align-items:flex-start;gap:12px;font-size:14px;line-height:1.45;cursor:pointer}
.check input{flex:none;width:22px;height:22px;margin:0;accent-color:var(--cran)}
.blocker{margin:-10px 0 0;text-align:center;font-size:13px;color:var(--cran);min-height:1em}

/* tags */
.tag-stage{display:flex;flex-direction:column;align-items:center;padding-top:4px}
.tag-string{width:1px;height:22px;background:#8E8467}
.tag{--tag-bg:#F4EEE3;--tag-fg:#6C151E;--tag-ink:#343F37;--tag-line:rgba(52,63,55,.25);position:relative;width:250px;max-width:100%;padding:30px 20px 16px;border-radius:5px 5px 9px 9px;background:var(--tag-bg);color:var(--tag-ink);box-shadow:0 14px 30px rgba(59,47,34,.3);transform:rotate(-2deg);transition:background-color .25s ease,color .25s ease}
.tag[data-color="red"]{--tag-bg:#6C151E;--tag-fg:#F4EEE3;--tag-ink:#F4EEE3;--tag-line:rgba(244,238,227,.35)}
.tag[data-color="gold"]{--tag-bg:#B18854;--tag-fg:#241C14;--tag-ink:#241C14;--tag-line:rgba(36,28,20,.3)}
.tag .hole{position:absolute;top:10px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:rgba(52,63,55,.5)}
.tag .charm-icon{position:absolute;top:11px;right:14px;color:var(--tag-fg)}
.tag .tag-text{margin:0 0 12px;font-size:15px;line-height:1.45;font-weight:400;color:var(--tag-ink);white-space:pre-line;overflow-wrap:anywhere}
.tag .tag-text.placeholder{opacity:.6}
.tag .tag-sig{padding-top:10px;border-top:1px dashed var(--tag-line);font-size:13px;font-weight:700}
.tag.big{width:310px;padding:40px 26px 22px;border-radius:6px 6px 10px 10px;transform:rotate(-1.5deg);box-shadow:0 20px 40px rgba(59,47,34,.3)}
.tag.big .hole{top:13px;width:10px;height:10px;margin-left:-5px}
.tag.big .charm-icon{top:14px;right:16px}
.tag.big .tag-text{font-size:19px;line-height:1.5;margin-bottom:18px}
.tag.big .tag-sig{padding-top:14px;font-size:15px}

/* preview + done */
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:22px 20px 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(108,21,30,.08);font-size:13px;color:var(--cream)}
.next{display:flex;flex-direction:column;gap:12px;margin:22px 20px 0;padding:18px;border-radius:14px;border:1px solid rgba(108,21,30,.18);background:rgba(255,255,255,.25)}
.next-title{font-size:13px;font-weight:500;letter-spacing:.12em;color:var(--gold)}
.next-row{display:flex;gap:12px;align-items:baseline;font-size:14px;line-height:1.45;color:var(--cream-2)}
.next-row b{flex:none;color:var(--cream)}
.actions{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:22px 20px 28px;padding-bottom:max(28px, env(safe-area-inset-bottom))}
.done-copy{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 28px 0;text-align:center}
.done-copy .script{font-family:var(--script);font-size:42px;line-height:1;color:var(--gold)}
.done-copy h1{font-size:28px}
.done-copy p{margin:0;font-size:15px;line-height:1.55;font-weight:400;color:var(--cream-2)}
.invite{display:flex;align-items:center;gap:14px;margin:26px 20px 0;padding:16px;border-radius:14px;border:1px solid rgba(108,21,30,.2);background:rgba(255,255,255,.3)}
.invite-icon{flex:none;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:rgba(177,136,84,.25);color:var(--gold)}
.invite-main{flex:1;min-width:0}
.invite-title{font-size:15px;font-weight:700}
.invite-sub{margin-top:2px;font-size:13px;line-height:1.4;color:var(--cream-2)}
.invite button{flex:none;min-height:44px;padding:0 14px;border:1px solid rgba(108,21,30,.35);border-radius:999px;background:transparent;color:var(--cream);font-size:14px;font-weight:500;cursor:pointer}
.center-msg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:40px 28px;text-align:center}
.center-msg h1{font-size:28px}
.center-msg p{margin:0;font-size:15px;line-height:1.55;color:var(--cream-2)}
.spinner{width:36px;height:36px;border-radius:50%;border:3px solid rgba(108,21,30,.2);border-top-color:var(--cran);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.demo-bar{margin:0 20px 16px;padding:10px 14px;border-radius:12px;background:#B18854;color:#241C14;font-size:12px;font-weight:500;line-height:1.45;text-align:center}
.demo-bar .pv{display:inline-block;margin-right:8px;padding:2px 9px;border-radius:999px;background:#6C151E;color:#F4EEE3;font-size:11px;font-weight:700;letter-spacing:.12em;vertical-align:1px}

/* tablet: centred phone-width column */
@media (min-width:481px) and (max-width:959px){ body{background:#C2B5A0} .app{box-shadow:0 0 60px rgba(59,47,34,.25)} }
/* desktop: wider page, live tag beside the form while writing */
@media (min-width:960px){
  body{background:#C2B5A0}
  .app{max-width:1120px;box-shadow:0 0 80px rgba(59,47,34,.25)}
  .bar{padding:22px 40px 0}
  .logo{height:34px}
  .bar-name{font-size:16px}
  .view{width:100%;max-width:580px;margin:0 auto;padding-bottom:40px}
  .sheet{flex:0 0 auto;border-radius:24px;margin:0 20px}
  #view-write{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px);gap:0 56px;align-items:start;padding:8px 48px 48px}
  #view-write .hero{position:sticky;top:24px;padding:48px 0 0}
  #view-write .hero h1{font-size:34px !important}
  #view-write .sheet{margin:24px 0 0}
  #view-write .tag{width:340px;padding:36px 26px 20px}
  #view-write .tag .tag-text{font-size:18px}
  #view-write .tag .tag-sig{font-size:14px}
  #view-preview .actions,#view-done .actions{padding-bottom:20px}
}
@media (max-width:360px){ .opt-grid.three{grid-template-columns:minmax(0,1fr)} .two{grid-template-columns:minmax(0,1fr)} .tag.big{width:100%} }
@media (prefers-reduced-motion:reduce){ .spinner{animation:none} .tag{transition:none} }
</style>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="wishtree.js"></script>
</head>
<body>
<div class="app">
  <div class="arc arc-1" aria-hidden="true"></div>

  <div class="bar">
    <div class="bar-left">
      <img id="logo" class="logo" alt="TP" hidden>
      <span class="bar-name">Wish Tree 2026</span>
    </div>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="ms" aria-pressed="false">BM</button>
      <button type="button" data-lang="th" aria-pressed="false" lang="th">ไทย</button>
    </div>
  </div>

  <!-- Loading -->
  <section id="view-loading" class="view">
    <div class="center-msg"><div class="spinner" aria-hidden="true"></div><p data-i18n="loading"></p></div>
  </section>

  <!-- Closed -->
  <section id="view-closed" class="view" hidden>
    <div class="center-msg">
      <h1 tabindex="-1" data-i18n="closedTitle"></h1>
      <p data-i18n="closedText"></p>
      <a class="btn btn-gold" href="index.html" data-i18n="seeTree"></a>
    </div>
  </section>

  <!-- Write -->
  <section id="view-write" class="view" hidden>
    <div class="arc arc-2" aria-hidden="true" style="top:-60px"></div>
    <div class="hero" style="gap:14px;padding-top:12px">
      <div class="progress">
        <div class="progress-main">
          <span class="step-label" data-i18n="step1"></span>
          <div class="bars"><span class="on"></span><span></span></div>
        </div>
      </div>
      <div class="script">Write it bright,</div>
      <h1 tabindex="-1" style="font-size:26px" id="writeTitle"></h1>
      <p data-i18n="writeSub"></p>
      <div class="tag-stage">
        <span class="tag-string" aria-hidden="true"></span>
        <div id="liveTag" class="tag" data-color="cream" role="img">
          <span class="hole" aria-hidden="true"></span>
          <span class="charm-icon" aria-hidden="true"></span>
          <p class="tag-text"></p>
          <div class="tag-sig"></div>
        </div>
      </div>
    </div>

    <div class="sheet">
      <div id="mineBox" class="mine" hidden>
        <div class="mine-top"><b data-i18n="mineTitle"></b><span id="mineStatus" class="status"></span></div>
        <div id="mineText"></div>
        <div style="display:flex;flex-wrap:wrap;gap:0 18px">
          <button type="button" class="link" id="otherBmsBtn" data-i18n="otherBms"></button>
          <button type="button" class="link" id="forgetBtn" data-i18n="forgetMe"></button>
        </div>
      </div>

      <fieldset class="about">
        <legend data-i18n="aboutLegend"></legend>
        <div class="field small">
          <label for="firstName" data-i18n="firstName"></label>
          <input id="firstName" class="input" type="text" autocomplete="nickname" maxlength="30" aria-describedby="firstHelp">
          <div class="help" id="firstHelp" data-i18n="firstHelp"></div>
        </div>
        <div class="two">
          <div class="field small">
            <label for="bms" data-i18n="bms"></label>
            <input id="bms" class="input digits" type="text" inputmode="numeric" autocomplete="off" maxlength="20" aria-describedby="bmsHelp">
          </div>
          <div class="field small">
            <label for="siteSel" data-i18n="site"></label>
            <select id="siteSel" class="select"></select>
          </div>
        </div>
        <div class="help" id="bmsHelp" data-i18n="bmsHelp" style="margin-top:-6px"></div>
      </fieldset>

      <fieldset>
        <legend data-i18n="colourLegend"></legend>
        <div class="opt-grid three">
          <button type="button" class="opt" data-color="cream"><span class="sw" style="background:#F4EEE3"></span><span data-i18n="c_cream"></span></button>
          <button type="button" class="opt" data-color="red"><span class="sw" style="background:#6C151E"></span><span data-i18n="c_red"></span></button>
          <button type="button" class="opt" data-color="gold"><span class="sw" style="background:#B18854"></span><span data-i18n="c_gold"></span></button>
        </div>
      </fieldset>

      <fieldset>

  /* ---------- State ---------- */
  var stored = C.storageGet('wt-lang');
  var siteParam = new URLSearchParams(window.location.search).get('site');
  var S = {
    view: 'loading',
    lang: T[stored] ? stored : 'en',
    mine: null,          // the wish this browser already sent (edit mode), or null
    color: 'cream',
    charm: 'snow',
    text: '',
    wishLang: null,
    wishLangTouched: false,
    first: '',
    bms: '',
    site: siteParam && C.siteById(siteParam) ? siteParam : (C.siteById(C.storageGet('wt-site')) ? C.storageGet('wt-site') : ''),
    consent: false,
    triedPreview: false,
    busy: false,
    errKey: '',
    lastWasEdit: false
  };

  var $ = function (id) { return document.getElementById(id); };
  var qsa = function (sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); };

  function t(key, vars) {
    var s = (T[S.lang] && T[S.lang][key]) || T.en[key] || key;
    if (vars) Object.keys(vars).forEach(function (k) { s = s.split('{' + k + '}').join(vars[k]); });
    return s;
  }
  function prizeVars() { return { n: PRIZE.winners || 5, amount: PRIZE.amount || 'RM 100' }; }
  function prizeOn() { return PRIZE.enabled !== false; }

  function siteLabel(id) {
    var s = C.siteById(id);
    return s ? s.label : '';
  }

  /* ---------- Field rules ---------- */
  function cleanName(v) { return String(v || '').replace(/[<>]/g, '').replace(/\s+/g, ' ').slice(0, 30); }
  function editing() { return !!(S.mine && S.mine.bms === S.bms); }

  /* ---------- Views ---------- */
  function show(view) {
    S.view = view;
    qsa('.view').forEach(function (v) { v.hidden = v.id !== 'view-' + view; });
    if (view === 'write') renderWrite();
    if (view === 'preview') renderPreview();
    if (view === 'done') renderDone();
    var h = document.querySelector('#view-' + view + ' h1');
    window.scrollTo(0, 0);
    if (h) setTimeout(function () { h.focus({ preventScroll: true }); }, 0);
  }

  function applyLang() {
    document.documentElement.lang = S.lang;
    qsa('[data-i18n]').forEach(function (n) { n.textContent = t(n.getAttribute('data-i18n')); });
    qsa('[data-i18n-ph]').forEach(function (n) { n.setAttribute('placeholder', t(n.getAttribute('data-i18n-ph'))); });
    qsa('.langs button').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-lang') === S.lang ? 'true' : 'false'); });
    qsa('.opt.charm').forEach(function (b) {
      var c = b.getAttribute('data-charm');
      b.innerHTML = C.iconSvg(c, 22) + '<span>' + C.esc(t('ch_' + c)) + '</span>';
      b.setAttribute('aria-label', t('ch_' + c));
    });
    renderSites();
    if (S.view === 'write') renderWrite();
    if (S.view === 'preview') renderPreview();
    if (S.view === 'done') renderDone();
  }

  function renderSites() {
    var sel = $('siteSel');
    var groups = [
      { label: 'Malaysia', items: C.SITES.filter(function (s) { return s.country === 'MY'; }) },
      { label: 'Thailand', items: C.SITES.filter(function (s) { return s.country === 'TH'; }) },
      { label: '', items: C.SITES.filter(function (s) { return s.country !== 'MY' && s.country !== 'TH'; }) }
    ];
    var opt = function (s) {
      var text = s.city ? s.label + ' (' + s.city + ')' : s.label;
      return '<option value="' + C.esc(s.id) + '">' + C.esc(text) + '</option>';
    };
    var html = '<option value="">' + C.esc(t('sitePick')) + '</option>';
    groups.forEach(function (g) {
      if (!g.items.length) return;
      if (g.label) html += '<optgroup label="' + C.esc(g.label) + '">' + g.items.map(opt).join('') + '</optgroup>';
      else html += g.items.map(opt).join('');
    });
    sel.innerHTML = html;
    sel.value = S.site;
  }

  /* ---------- Write ---------- */
  function signature() {
    var site = siteLabel(S.site);
    var name = S.first.trim() || t('yourName');
    return site ? name + ' · ' + site : name;
  }

  function effectiveWishLang() {
    if (S.wishLangTouched && S.wishLang) return S.wishLang;
    var guess = C.detectLang(S.text);      // Thai, Chinese, Japanese, Korean, Tamil and Vietnamese are spotted as you type
    if (guess) return guess;
    var fallback = S.wishLang || S.lang;
    return C.LANG_LABEL[fallback] ? fallback : (C.LANGUAGES[0] ? C.LANGUAGES[0].code : 'en');
  }

  function hasContactDetails(text) {
    if (/[^\s@]+@[^\s@]+\.[^\s@]{2,}/.test(text)) return true;
    var runs = text.match(/\+?\d[\d\s\-().]{6,}\d/g) || [];
    return runs.some(function (r) { return r.replace(/\D/g, '').length >= 9; });
  }

  function blockerKey() {
    if (!S.first.trim()) return 'needName';
    if (!C.validBms(S.bms)) return 'needBms';
    if (!S.site) return 'needSite';
    if (!S.text.trim()) return 'needText';
    if (!S.consent) return 'needConsent';
    return '';
  }

  function paintTag(node, big) {
    node.setAttribute('data-color', C.PALETTE[S.color] ? S.color : 'cream');
    node.querySelector('.charm-icon').innerHTML = C.iconSvg(S.charm, big ? 22 : 18);
    var p = node.querySelector('.tag-text');
    var has = !!S.text.trim();
    p.textContent = has ? S.text : t('tagPlaceholder');
    p.classList.toggle('placeholder', !has);
    p.setAttribute('lang', effectiveWishLang());
    node.querySelector('.tag-sig').textContent = signature();
    node.setAttribute('aria-label', (has ? S.text : t('tagPlaceholder')) + '. ' + signature());
  }

  function renderMine() {
    var box = $('mineBox');
    var m = S.mine;
    box.hidden = !m;
    $('writeTitle').textContent = editing() ? t('editTitle') : t('writeTitle');
    if (!m) return;
    var st = m.status === 'approved' || m.status === 'rejected' ? m.status : 'pending';
    $('mineStatus').setAttribute('data-s', st);
    $('mineStatus').textContent = t('status_' + st);
    $('mineText').textContent = st === 'rejected' ? t('mineRejected') : t('mineText', { bms: m.bms });
    $('bms').readOnly = editing();
  }

  function renderWrite() {
    renderMine();
    qsa('.opt[data-color]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-color') === S.color ? 'true' : 'false'); });
    qsa('.opt[data-charm]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-charm') === S.charm ? 'true' : 'false'); });
    var wl = effectiveWishLang();
    qsa('.seg button').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-wlang') === wl ? 'true' : 'false'); });

    var ta = $('wishText');
    if (ta.value !== S.text) ta.value = S.text;
    ta.setAttribute('maxlength', String(MAX));
    $('counter').textContent = S.text.length + ' / ' + MAX;
    $('contactWarn').hidden = !hasContactDetails(S.text);

    if ($('firstName').value !== S.first) $('firstName').value = S.first;
    if ($('bms').value !== S.bms) $('bms').value = S.bms;
    $('siteSel').value = S.site;
    $('consent').checked = S.consent;

    var key = blockerKey();
    var shown = S.triedPreview && key;
    $('blocker').textContent = shown ? t(key) : '';
    $('firstName').setAttribute('aria-invalid', shown && key === 'needName' ? 'true' : 'false');
    $('bms').setAttribute('aria-invalid', shown && key === 'needBms' ? 'true' : 'false');

    paintTag($('liveTag'), false);
  }

  /* ---------- Preview / done ---------- */
  function renderPreview() {
    paintTag($('bigTag'), true);
    $('previewLang').textContent = C.LANG_LABEL[effectiveWishLang()] || '';
    $('previewBms').textContent = t('bmsChip', { bms: S.bms });
    $('next3').textContent = prizeOn() ? t('next3', prizeVars()) : t('next3plain');
    $('hangLabel').textContent = S.busy ? t('sending') : (editing() ? t('saveBtn') : t('hangBtn'));
    $('hangBtn').disabled = S.busy;
    $('submitErr').textContent = S.errKey ? t(S.errKey) : '';
  }

  var ICON_INNER = {
    snow: '<path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M9.5 4.5 12 7l2.5-2.5M9.5 19.5 12 17l2.5 2.5"/>',
    star: '<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>',
    tree: '<path d="M12 3 6.5 10h3L5 16h14l-4.5-6h3zM12 16v4.5"/>',
    gift: '<path d="M4 10h16v10H4zM3 7h18v3H3zM12 7v13M12 7c-1.5-3-5-3.5-5-1.5S10 7 12 7zm0 0c1.5-3 5-3.5 5-1.5S14 7 12 7z"/>'
  };

  function renderDone() {
    $('doneTitle').textContent = S.lastWasEdit ? t('doneEditTitle') : t('doneTitle');
    $('doneText').textContent = t('doneText', { reveal: CFG.REVEAL_DATE || '' });
    $('donePrize').hidden = !prizeOn();
    $('donePrize').textContent = prizeOn() ? t('donePrize', prizeVars()) : '';
    $('seeTreeBtn').href = C.url('index.html') + (S.site ? '?site=' + encodeURIComponent(S.site) : '');
    var pal = C.PALETTE[S.color] || C.PALETTE.cream;
    $('doneTagRect').setAttribute('fill', pal.bg);
    var icon = $('doneTagIcon');
    icon.setAttribute('stroke', pal.fg);
    icon.innerHTML = ICON_INNER[S.charm] || ICON_INNER.snow;
  }

  /* ---------- Your wish, if this browser already sent one ---------- */
  function fillFromMine(m) {
    S.mine = m;
    if (!m) return;
    S.bms = m.bms;
    S.first = m.first_name || '';
    S.site = C.siteById(m.site) ? m.site : S.site;
    S.text = m.message || '';
    S.color = C.PALETTE[m.tag_color] ? m.tag_color : 'cream';
    S.charm = ICON_INNER[m.charm] ? m.charm : 'snow';
    S.wishLang = C.LANG_LABEL[m.lang] ? m.lang : null;
    S.wishLangTouched = !!S.wishLang;
    S.consent = true;
  }

  /* ---------- Submit ---------- */
  function submit() {
    if (S.busy) return;
    var key = blockerKey();
    if (key) { S.triedPreview = true; show('write'); return; }
    if (CFG.SUBMISSIONS_OPEN === false) { S.errKey = 'errClosed'; renderPreview(); return; }

    var row = {
      bms: C.cleanBms(S.bms),
      first_name: cleanName(S.first).trim(),
      message: S.text.trim().slice(0, MAX),
      site: S.site,
      lang: effectiveWishLang(),
      tag_color: S.color,
      charm: S.charm
    };
    var wasEdit = editing();

    S.errKey = '';
    S.busy = true;
    renderPreview();

    C.submitWish(row).then(function (r) {
      S.busy = false;
      if (r.result === 'ok') {
        S.lastWasEdit = wasEdit;
        S.mine = Object.assign({}, S.mine || {}, { bms: row.bms, status: 'pending' }, row);
        C.track(wasEdit ? 'wish_edit' : 'wish_submit', { site: row.site, lang: row.lang });
        show('done');
        return;
      }
      S.errKey = r.result === 'bms_taken' ? 'errBmsTaken'  : r.result === 'slow_down' ? 'errSlow' : 'errSubmit';
      renderPreview();
    }).catch(function (err) {
      console.error(err);
      S.busy = false;
      var m = String((err && (err.message || err.details)) || '').toLowerCase();
      S.errKey = m.indexOf('wishes_closed') !== -1 ? 'errClosed' : m.indexOf('bad_bms') !== -1 ? 'needBms'
        : m.indexOf('name_required') !== -1 ? 'needName' : 'errSubmit';
      renderPreview();
    });
  }

  function share() {
    var url = new URL('wish.html', window.location.href).href;
    if (CFG.WISH_PAGE_URL) url = CFG.WISH_PAGE_URL;
    var btn = $('shareBtn');
    var mark = function () { btn.textContent = t('copied'); setTimeout(function () { btn.textContent = t('copyLink'); }, 2500); };
    if (navigator.share) {
      navigator.share({ title: 'TP Wish Tree', text: t('shareText'), url: url }).catch(function () { /* cancelled */ });
      C.track('wish_share', { method: 'native' });
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(mark, function () { window.prompt(t('copyLink'), url); });
    } else {
      window.prompt(t('copyLink'), url);
    }
    C.track('wish_share', { method: 'copy' });
  }

  /* ---------- Events ---------- */
  qsa('.langs button').forEach(function (b) {
    b.addEventListener('click', function () {
      S.lang = b.getAttribute('data-lang');
      C.storageSet('wt-lang', S.lang);
      applyLang();
    });
  });

  qsa('.opt[data-color]').forEach(function (b) {
    b.addEventListener('click', function () { S.color = b.getAttribute('data-color'); renderWrite(); });
  });
  qsa('.opt[data-charm]').forEach(function (b) {
    b.addEventListener('click', function () { S.charm = b.getAttribute('data-charm'); renderWrite(); });
  });
  qsa('[data-starter]').forEach(function (b) {
    b.addEventListener('click', function () {
      S.text = t('seed_' + b.getAttribute('data-starter'));
      renderWrite();
      var ta = $('wishText');
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);
    });
  });
  $('wishText').addEventListener('input', function (e) {
    S.text = e.target.value.slice(0, MAX);
    renderWrite();
  });
  // "Written in": one button per language in config.js
  $('wlangSeg').innerHTML = C.LANGUAGES.map(function (l) {
    return '<button type="button" data-wlang="' + C.esc(l.code) + '" lang="' + C.esc(l.code) + '"' +
      (l.english && l.english !== l.label ? ' title="' + C.esc(l.english) + '"' : '') + '>' + C.esc(l.label) + '</button>';
  }).join('');
  $('wlangSeg').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button[data-wlang]') : null;
    if (!b) return;
    S.wishLang = b.getAttribute('data-wlang');
    S.wishLangTouched = true;
    renderWrite();
  });
  $('firstName').addEventListener('input', function (e) {
    var v = cleanName(e.target.value);
    if (v !== e.target.value) e.target.value = v;
    S.first = v;
    renderWrite();
  });
  $('bms').addEventListener('input', function (e) {
    if (editing()) return;
    var v = C.cleanBms(e.target.value);
    if (v !== e.target.value) e.target.value = v;
    S.bms = v;
    renderWrite();
  });
  $('siteSel').addEventListener('change', function (e) { S.site = e.target.value; C.storageSet('wt-site', S.site); renderWrite(); });
  $('consent').addEventListener('change', function (e) { S.consent = e.target.checked; renderWrite(); });
  function freshForm() {
    S.mine = null;
    S.bms = '';
    S.first = '';
    S.text = '';
    S.consent = false;
    S.triedPreview = false;
    S.wishLang = null;
    S.wishLangTouched = false;
    $('bms').readOnly = false;
  }
  function forget() {
    C.forgetMe();
    freshForm();
    show('write');
    $('blocker').textContent = t('forgotten');
  }
  $('forgetBtn').addEventListener('click', forget);
  $('forgetDoneBtn').addEventListener('click', forget);
  $('otherBmsBtn').addEventListener('click', function () {
    // a colleague on the same phone: start a fresh wish with their own BMS (the first one stays as it is)
    S.mine = null;
    S.bms = '';
    S.first = '';
    S.text = '';
    S.consent = false;
    S.triedPreview = false;
    S.wishLang = null;
    S.wishLangTouched = false;
    $('bms').readOnly = false;
    renderWrite();
    $('firstName').focus();
  });

  $('toPreviewBtn').addEventListener('click', function () {
    var key = blockerKey();
    if (key) {
      S.triedPreview = true;
      renderWrite();
      var focusMap = { needText: 'wishText', needName: 'firstName', needBms: 'bms', needSite: 'siteSel', needConsent: 'consent' };
      var f = $(focusMap[key]);
      if (f) f.focus();
      return;
    }
    S.errKey = '';
    show('preview');
  });
  $('backToWrite').addEventListener('click', function () { show('write'); });
  $('editBtn').addEventListener('click', function () { show('write'); });
  $('hangBtn').addEventListener('click', submit);
  $('shareBtn').addEventListener('click', share);
  $('anotherBtn').addEventListener('click', function () { S.triedPreview = false; show('write'); });

  /* ---------- Start ---------- */
  C.initGA();
  C.setLogo($('logo'));
  if (C.demo) $('demoBar').hidden = false;
  applyLang();

  if (CFG.SUBMISSIONS_OPEN === false) {
    show('closed');
    return;
  }

  function start() {
    C.getMyWish().then(function (m) {
      fillFromMine(m);
      show('write');
    }).catch(function (err) {
      console.error(err);
      show('write');
    });
  }

  if (C.demo) {
    if (C.demoLoad('wt-demo-settings', {}).submissions_open === false) { show('closed'); return; }
    start();
    return;
  }

  var sb;
  try {
    sb = C.client();
  } catch (err) {
    console.error(err);
    show('write');
    $('blocker').textContent = t('errGeneric');
    return;
  }

  // The Wish Tree team can close new wishes from the approvals page
  sb.rpc('get_settings').then(function (res) {
    var st = res && Array.isArray(res.data) ? res.data[0] : res && res.data;
    return !(st && st.submissions_open === false);
  }, function () { return true; }).then(function (open) {
    if (!open) { show('closed'); return; }
    start();
  });
})();
</script>
</body>
</html>
