<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hang your wish · TP Wish Tree 2026</title>
<meta name="description" content="Write a Christmas wish and hang it on the shared TP Malaysia and Thailand wish tree.">
<meta name="theme-color" content="#0E2A1F">
<link rel="icon" type="image/png" href="assets/tp-logo-white.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Sans:wght@300;400;500;700&family=Noto+Sans+Thai:wght@300;400;500;700&family=Noto+Sans+SC:wght@300;400;700&family=Noto+Sans+JP:wght@300;400;700&family=Noto+Sans+KR:wght@300;400;700&family=Noto+Sans+Tamil:wght@300;400;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'TP Sans';font-weight:300;font-display:swap;src:local('TP Sans Light'),local('TPSans-Light'),url('fonts/TPSans-Light.ttf') format('truetype')}
@font-face{font-family:'TP Sans';font-weight:400;font-display:swap;src:local('TP Sans'),local('TPSans-Regular'),url('fonts/TPSans-Regular.ttf') format('truetype')}
@font-face{font-family:'TP Sans';font-weight:500;font-display:swap;src:local('TP Sans Medium'),local('TPSans-Medium'),url('fonts/TPSans-Medium.ttf') format('truetype')}
@font-face{font-family:'TP Sans';font-weight:700;font-display:swap;src:local('TP Sans Bold'),local('TPSans-Bold'),url('fonts/TPSans-Bold.ttf') format('truetype')}

:root{
  --bg:#0E2A1F; --bg-2:#11302A;
  --cream:#F6EEDC; --cream-2:#DCD3BF; --paper:#FBF6EA; --paper-2:#EFE6D2;
  --gold:#E3B45A; --gold-2:#F2C766; --carmine:#AB2C37;
  --ink:#183326; --slate:#4B4C6A; --field:#C9BFA8; --field-off:#DDD3BE; --focus:#00AF9B;
  --font:'TP Sans','Noto Sans','Noto Sans Thai',Calibri,system-ui,sans-serif;
  --script:'Great Vibes',cursive;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--cream);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[hidden]{display:none !important}

.app{position:relative;max-width:480px;min-height:100vh;min-height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}

/* top bar */
.bar{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px 0;padding-top:max(14px, env(safe-area-inset-top))}
.bar-left{display:flex;align-items:center;gap:10px;min-height:36px}
.logo{height:28px;width:auto;display:block}
.bar-name{font-size:14px;font-weight:500;color:var(--cream-2)}
.langs{display:flex;gap:4px;padding:3px;border-radius:999px;background:rgba(246,238,220,.1)}
.langs button{min-width:48px;min-height:36px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:var(--cream);font-size:14px;font-weight:500;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--cream);color:var(--bg)}

.view{position:relative;flex:1;display:flex;flex-direction:column}
.view h1{margin:0;font-weight:300;line-height:1.15}
.view h1:focus{outline:none}

/* dark hero */
.hero{position:relative;display:flex;flex-direction:column;gap:10px;padding:24px 24px 28px}
.hero .script{font-family:var(--script);font-size:40px;line-height:1;color:var(--gold)}
.hero h1{font-size:30px;color:var(--cream)}
.hero p{margin:0;font-size:15px;line-height:1.5;font-weight:300;color:var(--cream-2)}
.arc{position:absolute;border-radius:50%;pointer-events:none}
.arc-1{right:-150px;top:-140px;width:360px;height:360px;border:1px solid rgba(227,180,90,.18)}
.arc-2{right:-180px;top:160px;width:380px;height:380px;background:var(--bg-2)}
.deco-tags{position:absolute;right:30px;top:0;display:flex;gap:14px;align-items:flex-start;pointer-events:none}
.deco-tags span{display:flex;flex-direction:column;align-items:center;transform-origin:50% 0}
.deco-tags i{display:block;width:1px;background:#D9C59A}
.deco-tags b{display:block;width:30px;height:40px;border-radius:3px 3px 5px 5px}

/* progress */
.progress{display:flex;align-items:center;gap:12px}
.back{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin-left:-10px;border:0;border-radius:50%;background:transparent;color:var(--cream);cursor:pointer}
.back:hover{background:rgba(246,238,220,.08)}
.progress-main{flex:1;display:flex;flex-direction:column;gap:6px}
.step-label{font-size:12px;font-weight:500;letter-spacing:.12em;color:var(--gold)}
.bars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.bars span{height:4px;border-radius:2px;background:rgba(246,238,220,.2)}
.bars span.on{background:var(--gold)}

/* cream sheet */
.sheet{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;gap:22px;padding:24px 20px 32px;padding-bottom:max(32px, env(safe-area-inset-bottom));border-radius:24px 24px 0 0;background:var(--paper);color:var(--ink)}
.sheet fieldset{margin:0;padding:0;border:0;min-width:0}
.sheet legend,.sheet .label{padding:0;margin-bottom:10px;font-size:15px;font-weight:700;color:var(--ink)}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field label{font-size:15px;font-weight:700}
.field.small label{font-size:13px;font-weight:500}
.input,.select,.textarea{width:100%;min-width:0;border:1.5px solid var(--field);border-radius:12px;background:#fff;color:var(--ink);font-size:16px}
.input,.select{height:52px;padding:0 16px}
.select{padding:0 12px}
.textarea{padding:14px 16px;line-height:1.45;resize:none}
.input:focus,.select:focus,.textarea:focus{border-color:var(--bg);outline:none;box-shadow:0 0 0 3px rgba(0,175,155,.35)}
.help{font-size:13px;line-height:1.45;color:var(--slate)}
.err{margin:0;padding:10px 12px;border-radius:10px;background:#F8E5E7;color:#7E1F28;font-size:14px;line-height:1.45}
.err:empty{display:none}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;padding:0 20px;border:0;border-radius:999px;font-size:17px;font-weight:700;text-decoration:none;cursor:pointer}
.btn-dark{background:var(--bg);color:var(--cream)}
.btn-dark:hover{background:#163D2E}
.btn-gold{background:var(--gold);color:var(--bg)}
.btn-gold:hover{background:var(--gold-2)}
.btn-line{min-height:52px;border:1px solid rgba(246,238,220,.4);background:transparent;color:var(--cream);font-weight:500;font-size:16px}
.btn-line:hover{background:rgba(246,238,220,.08)}
.btn-google{background:#fff;color:#1F1F1F;border:1.5px solid var(--field);font-weight:500;font-size:16px}
.btn-google:hover{background:#F7F7F7}
.btn[disabled]{opacity:.6;cursor:progress}
.link{min-height:44px;padding:0;border:0;background:transparent;color:var(--carmine);font-size:14px;font-weight:500;text-decoration:underline;cursor:pointer;align-self:flex-start}
.link-cream{color:var(--cream)}

.privacy{display:flex;align-items:flex-start;gap:10px;margin-top:auto;font-size:12px;line-height:1.5;color:var(--slate)}
.privacy svg{flex:none;margin-top:1px}

.code-input{height:64px;padding:0 16px;text-align:center;font-size:28px;font-weight:500;letter-spacing:.5em}

/* write view */
.who{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px;margin:-6px 0 -8px;font-size:13px;color:var(--slate)}
.who .link{min-height:36px;font-size:13px;color:var(--slate)}
.opt-grid{display:grid;gap:10px}
.opt-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt-grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.opt{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 12px;border:1.5px solid var(--field-off);border-radius:12px;background:#fff;color:var(--ink);font-size:14px;font-weight:500;cursor:pointer;text-align:left}
.opt[aria-pressed="true"]{border:2px solid var(--bg);box-shadow:0 0 0 2px rgba(14,42,31,.08)}
.opt .sw{flex:none;width:22px;height:28px;border-radius:3px 3px 4px 4px;box-shadow:inset 0 0 0 1px rgba(14,42,31,.15)}
.opt.charm{flex-direction:column;justify-content:center;gap:4px;min-height:66px;padding:6px 4px;color:var(--carmine);text-align:center}
.opt.charm span{font-size:12px;font-weight:400;color:var(--slate)}
.starters{display:flex;flex-wrap:wrap;gap:8px}
.starters button{min-height:36px;padding:0 14px;border:1px solid var(--field);border-radius:999px;background:transparent;color:var(--ink);font-size:13px;cursor:pointer}
.starters button:hover{background:var(--paper-2)}
.field-foot{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;font-size:12px;color:var(--slate)}
.counter{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.warn{color:#A33A00;font-weight:500;line-height:1.45}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:40px;padding:0 14px;border:1px solid var(--line-2,rgba(24,51,38,.2));border-radius:999px;background:var(--paper-2);color:var(--ink);font-size:14px;font-weight:500;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--bg);border-color:var(--bg);color:var(--cream)}
:lang(zh){font-family:'Noto Sans SC','Noto Sans',system-ui,sans-serif}
:lang(ja){font-family:'Noto Sans JP','Noto Sans',system-ui,sans-serif}
:lang(ko){font-family:'Noto Sans KR','Noto Sans',system-ui,sans-serif}
:lang(ta){font-family:'Noto Sans Tamil','Noto Sans',system-ui,sans-serif}
.radio-card{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 14px;margin-bottom:10px;border:1.5px solid var(--field-off);border-radius:12px;background:#fff;cursor:pointer}
.radio-card:last-child{margin-bottom:0}
.radio-card:has(input:checked){border:2px solid var(--bg)}
.radio-card input{flex:none;width:20px;height:20px;margin:0;accent-color:var(--bg)}
.radio-card .rc-main{display:block;font-size:15px;font-weight:500}
.radio-card .rc-ex{display:block;margin-top:2px;font-size:13px;color:var(--slate)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.two.one{grid-template-columns:minmax(0,1fr)}
.rules{display:flex;gap:12px;padding:14px 16px;border-radius:12px;background:var(--paper-2);font-size:13px;line-height:1.5}
.rules svg{flex:none;margin-top:1px}
.check{display:flex;align-items:flex-start;gap:12px;font-size:14px;line-height:1.45;cursor:pointer}
.check input{flex:none;width:22px;height:22px;margin:0;accent-color:var(--bg)}
.blocker{margin:-10px 0 0;text-align:center;font-size:13px;color:var(--carmine);min-height:1em}

/* tags */
.tag-stage{display:flex;flex-direction:column;align-items:center;padding-top:4px}
.tag-string{width:1px;height:22px;background:#D9C59A}
.tag{--tag-bg:#F6EEDC;--tag-fg:#AB2C37;--tag-ink:#183326;--tag-line:rgba(24,51,38,.25);position:relative;width:250px;max-width:100%;padding:30px 20px 16px;border-radius:5px 5px 9px 9px;background:var(--tag-bg);color:var(--tag-ink);box-shadow:0 14px 30px rgba(0,0,0,.4);transform:rotate(-2deg);transition:background-color .25s ease,color .25s ease}
.tag[data-color="red"]{--tag-bg:#AB2C37;--tag-fg:#F6EEDC;--tag-ink:#F6EEDC;--tag-line:rgba(246,238,220,.35)}
.tag[data-color="gold"]{--tag-bg:#E3B45A;--tag-fg:#0E2A1F;--tag-ink:#0E2A1F;--tag-line:rgba(14,42,31,.3)}
.tag .hole{position:absolute;top:10px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:rgba(14,42,31,.5)}
.tag .charm-icon{position:absolute;top:11px;right:14px;color:var(--tag-fg)}
.tag .tag-text{margin:0 0 12px;font-size:15px;line-height:1.45;font-weight:400;color:var(--tag-ink);white-space:pre-line;overflow-wrap:anywhere}
.tag .tag-text.placeholder{opacity:.6}
.tag .tag-sig{padding-top:10px;border-top:1px dashed var(--tag-line);font-size:13px;font-weight:700}
.tag.big{width:310px;padding:40px 26px 22px;border-radius:6px 6px 10px 10px;transform:rotate(-1.5deg);box-shadow:0 20px 40px rgba(0,0,0,.45)}
.tag.big .hole{top:13px;width:10px;height:10px;margin-left:-5px}
.tag.big .charm-icon{top:14px;right:16px}
.tag.big .tag-text{font-size:19px;line-height:1.5;margin-bottom:18px}
.tag.big .tag-sig{padding-top:14px;font-size:15px}

/* preview + done */
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:22px 20px 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(246,238,220,.1);font-size:13px;color:var(--cream)}
.next{display:flex;flex-direction:column;gap:12px;margin:22px 20px 0;padding:18px;border-radius:14px;border:1px solid rgba(246,238,220,.14)}
.next-title{font-size:13px;font-weight:500;letter-spacing:.12em;color:var(--gold)}
.next-row{display:flex;gap:12px;align-items:baseline;font-size:14px;line-height:1.45;color:var(--cream-2)}
.next-row b{flex:none;color:var(--cream)}
.actions{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:22px 20px 28px;padding-bottom:max(28px, env(safe-area-inset-bottom))}
.done-copy{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 28px 0;text-align:center}
.done-copy .script{font-family:var(--script);font-size:42px;line-height:1;color:var(--gold)}
.done-copy h1{font-size:28px}
.done-copy p{margin:0;font-size:15px;line-height:1.55;font-weight:300;color:var(--cream-2)}
.invite{display:flex;align-items:center;gap:14px;margin:26px 20px 0;padding:16px;border-radius:14px;border:1px solid rgba(227,180,90,.35);background:rgba(246,238,220,.04)}
.invite-icon{flex:none;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:rgba(227,180,90,.16);color:var(--gold)}
.invite-main{flex:1;min-width:0}
.invite-title{font-size:15px;font-weight:700}
.invite-sub{margin-top:2px;font-size:13px;line-height:1.4;color:var(--cream-2)}
.invite button{flex:none;min-height:44px;padding:0 14px;border:1px solid rgba(246,238,220,.4);border-radius:999px;background:transparent;color:var(--cream);font-size:14px;font-weight:500;cursor:pointer}
.center-msg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:40px 28px;text-align:center}
.center-msg h1{font-size:28px}
.center-msg p{margin:0;font-size:15px;line-height:1.55;color:var(--cream-2)}
.spinner{width:36px;height:36px;border-radius:50%;border:3px solid rgba(246,238,220,.2);border-top-color:var(--gold);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.demo-bar{margin:0 20px 16px;padding:10px 14px;border-radius:12px;background:#FFF1E8;color:#7A2C00;font-size:12px;font-weight:500;text-align:center}

/* tablet: centred phone-width column */
@media (min-width:481px) and (max-width:959px){ body{background:#0A2018} .app{box-shadow:0 0 60px rgba(0,0,0,.4)} }
/* desktop: wider page, live tag beside the form while writing */
@media (min-width:960px){
  body{background:#0A2018}
  .app{max-width:1120px;box-shadow:0 0 80px rgba(0,0,0,.4)}
  .bar{padding:22px 40px 0}
  .logo{height:34px}
  .bar-name{font-size:16px}
  .view{width:100%;max-width:580px;margin:0 auto;padding-bottom:40px}
  .sheet{flex:0 0 auto;border-radius:24px;margin:0 20px}
  .deco-tags{right:70px}
  #view-write{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px);gap:0 56px;align-items:start;padding:8px 48px 48px}
  #view-write .hero{position:sticky;top:24px;padding:48px 0 0}
  #view-write .hero h1{font-size:34px !important}
  #view-write .sheet{margin:24px 0 0}
  #view-write .tag{width:340px;padding:36px 26px 20px}
  #view-write .tag .tag-text{font-size:18px}
  #view-write .tag .tag-sig{font-size:14px}
  #view-preview .actions,#view-done .actions{padding-bottom:20px}
}
@media (max-width:360px){ .opt-grid.three{grid-template-columns:minmax(0,1fr)} .tag.big{width:100%} }
@media (prefers-reduced-motion:reduce){ .spinner{animation:none} .tag{transition:none} }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="wishtree.js"></script>
</head>
<body>
<div class="app">
  <div class="arc arc-1" aria-hidden="true"></div>

  <div class="bar">
    <div class="bar-left">
      <img id="logo" class="logo" alt="TP" hidden>
      <span class="bar-name">Wish Tree 2026</span>
    </div>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="ms" aria-pressed="false">BM</button>
      <button type="button" data-lang="th" aria-pressed="false" lang="th">ไทย</button>
    </div>
  </div>

  <!-- Loading -->
  <section id="view-loading" class="view">
    <div class="center-msg"><div class="spinner" aria-hidden="true"></div><p data-i18n="loading"></p></div>
  </section>

  <!-- Closed -->
  <section id="view-closed" class="view" hidden>
    <div class="center-msg">
      <h1 tabindex="-1" data-i18n="closedTitle"></h1>
      <p data-i18n="closedText"></p>
      <a class="btn btn-gold" href="index.html" data-i18n="seeTree"></a>
    </div>
  </section>

  <!-- Sign in -->
  <section id="view-signin" class="view" hidden>
    <div class="deco-tags" aria-hidden="true">
      <span style="transform:rotate(-6deg)"><i style="height:30px"></i><b style="background:#F6EEDC"></b></span>
      <span style="transform:rotate(4deg)"><i style="height:52px"></i><b style="background:#AB2C37"></b></span>
      <span style="transform:rotate(-3deg)"><i style="height:16px"></i><b style="background:#E3B45A"></b></span>
    </div>
    <div class="hero" style="padding-top:96px">
      <div class="script">Write it bright,</div>
      <h1 tabindex="-1" data-i18n="signinTitle"></h1>
      <p data-i18n="signinSub"></p>
    </div>
    <div class="sheet">
      <div id="googleBlock" class="field" hidden>
        <button type="button" id="googleBtn" class="btn btn-google">
          <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
          <span data-i18n="googleBtn"></span>
        </button>
        <div class="help" id="googleHelp"></div>
      </div>

      <form id="emailForm" class="field" novalidate hidden>
        <label for="email" data-i18n="emailLabel"></label>
        <input id="email" class="input" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" required>
        <div class="help" data-i18n="emailHelp"></div>
        <button type="submit" id="sendCodeBtn" class="btn btn-dark" style="margin-top:12px">
          <span data-i18n="sendCode"></span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>

      <p id="signinErr" class="err" role="alert"></p>

      <div class="privacy">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4B4C6A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <span data-i18n="privacy"></span>
      </div>
    </div>
  </section>

  <!-- Email code -->

  };

  /* ---------- State ---------- */
  var stored = C.storageGet('wt-lang');
  var siteParam = new URLSearchParams(window.location.search).get('site');
  var S = {
    view: 'loading',
    lang: T[stored] ? stored : 'en',
    user: null,
    email: '',
    color: 'cream',
    charm: 'snow',
    text: '',
    wishLang: null,
    wishLangTouched: false,
    mode: 'name',
    first: '',
    site: siteParam && C.siteById(siteParam) ? siteParam : (C.siteById(C.storageGet('wt-site')) ? C.storageGet('wt-site') : ''),
    consent: false,
    triedPreview: false,
    busy: false
  };

  var $ = function (id) { return document.getElementById(id); };
  var qsa = function (sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); };

  function t(key, vars) {
    var s = (T[S.lang] && T[S.lang][key]) || T.en[key] || key;
    if (vars) Object.keys(vars).forEach(function (k) { s = s.split('{' + k + '}').join(vars[k]); });
    return s;
  }

  // "One Precinct" for display on the tag
  function siteLabel(id) {
    var s = C.siteById(id);
    return s ? s.label : '';
  }

  /* ---------- Views ---------- */
  function show(view) {
    S.view = view;
    qsa('.view').forEach(function (v) { v.hidden = v.id !== 'view-' + view; });
    if (view === 'write') renderWrite();
    if (view === 'preview') renderPreview();
    if (view === 'done') renderDone();
    var h = document.querySelector('#view-' + view + ' h1');
    window.scrollTo(0, 0);
    if (h) setTimeout(function () { h.focus({ preventScroll: true }); }, 0);
  }

  function applyLang() {
    document.documentElement.lang = S.lang;
    qsa('[data-i18n]').forEach(function (n) { n.textContent = t(n.getAttribute('data-i18n')); });
    qsa('[data-i18n-ph]').forEach(function (n) { n.setAttribute('placeholder', t(n.getAttribute('data-i18n-ph'))); });
    qsa('.langs button').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-lang') === S.lang ? 'true' : 'false'); });
    $('googleHelp').textContent = t('googleHelp', { domain: DOMAIN });
    $('email').setAttribute('placeholder', 'name@' + DOMAIN);
    $('codeLabel').textContent = t('codeLabel', { email: S.email || '' });
    qsa('.opt.charm').forEach(function (b) {
      var c = b.getAttribute('data-charm');
      b.innerHTML = C.iconSvg(c, 22) + '<span>' + C.esc(t('ch_' + c)) + '</span>';
      b.setAttribute('aria-label', t('ch_' + c));
    });
    renderSites();
    if (S.view === 'write') renderWrite();
    if (S.view === 'preview') renderPreview();
    if (S.view === 'done') renderDone();
    renderWho();
  }

  function renderSites() {
    var sel = $('siteSel');
    var groups = [
      { label: 'Malaysia', items: C.SITES.filter(function (s) { return s.country === 'MY'; }) },
      { label: 'Thailand', items: C.SITES.filter(function (s) { return s.country === 'TH'; }) },
      { label: '', items: C.SITES.filter(function (s) { return s.country !== 'MY' && s.country !== 'TH'; }) }
    ];
    var opt = function (s) {
      var text = s.city ? s.label + ' (' + s.city + ')' : s.label;
      return '<option value="' + C.esc(s.id) + '">' + C.esc(text) + '</option>';
    };
    var html = '<option value="">' + C.esc(t('sitePick')) + '</option>';
    groups.forEach(function (g) {
      if (!g.items.length) return;
      if (g.label) html += '<optgroup label="' + C.esc(g.label) + '">' + g.items.map(opt).join('') + '</optgroup>';
      else html += g.items.map(opt).join('');
    });
    sel.innerHTML = html;
    sel.value = S.site;
  }

  function renderWho() {
    $('whoText').textContent = S.user ? t('signedInAs', { email: S.user.email }) : '';
  }

  /* ---------- Write ---------- */
  function signature() {
    var site = siteLabel(S.site);
    var name = S.mode === 'anon' ? t('anonName') : (S.first.trim() || t('yourName'));
    return site ? name + ' · ' + site : name;
  }

  function effectiveWishLang() {
    if (S.wishLangTouched && S.wishLang) return S.wishLang;
    var guess = C.detectLang(S.text);      // Thai, Chinese, Japanese, Korean, Tamil and Vietnamese are spotted as you type
    if (guess) return guess;
    var fallback = S.wishLang || S.lang;
    return C.LANG_LABEL[fallback] ? fallback : (C.LANGUAGES[0] ? C.LANGUAGES[0].code : 'en');
  }

  function hasContactDetails(text) {
    if (/[^\s@]+@[^\s@]+\.[^\s@]{2,}/.test(text)) return true;
    var runs = text.match(/\+?\d[\d\s\-().]{6,}\d/g) || [];
    return runs.some(function (r) { return r.replace(/\D/g, '').length >= 9; });
  }

  function blockerKey() {
    if (!S.text.trim()) return 'needText';
    if (S.mode === 'name' && !S.first.trim()) return 'needName';
    if (!S.site) return 'needSite';
    if (!S.consent) return 'needConsent';
    return '';
  }

  function paintTag(node, big) {
    node.setAttribute('data-color', C.PALETTE[S.color] ? S.color : 'cream');
    node.querySelector('.charm-icon').innerHTML = C.iconSvg(S.charm, big ? 22 : 18);
    var p = node.querySelector('.tag-text');
    var has = !!S.text.trim();
    p.textContent = has ? S.text : t('tagPlaceholder');
    p.classList.toggle('placeholder', !has);
    p.setAttribute('lang', effectiveWishLang());
    node.querySelector('.tag-sig').textContent = signature();
    node.setAttribute('aria-label', (has ? S.text : t('tagPlaceholder')) + '. ' + signature());
  }

  function renderWrite() {
    qsa('.opt[data-color]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-color') === S.color ? 'true' : 'false'); });
    qsa('.opt[data-charm]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-charm') === S.charm ? 'true' : 'false'); });
    var wl = effectiveWishLang();
    qsa('.seg button').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-wlang') === wl ? 'true' : 'false'); });
    qsa('input[name="mode"]').forEach(function (r) { r.checked = r.value === S.mode; });

    var ta = $('wishText');
    if (ta.value !== S.text) ta.value = S.text;
    ta.setAttribute('maxlength', String(MAX));
    $('counter').textContent = S.text.length + ' / ' + MAX;
    $('contactWarn').hidden = !hasContactDetails(S.text);

    var fn = $('firstName');
    if (fn.value !== S.first) fn.value = S.first;
    $('firstWrap').hidden = S.mode !== 'name';
    $('nameRow').classList.toggle('one', S.mode !== 'name');
    $('siteSel').value = S.site;
    $('consent').checked = S.consent;

    var site = S.site ? ' · ' + siteLabel(S.site) : '';
    $('exName').textContent = (S.first.trim() || t('yourName')) + site;
    $('exAnon').textContent = t('anonName') + site;

    paintTag($('liveTag'), false);
    var key = blockerKey();
    $('blocker').textContent = S.triedPreview && key ? t(key) : '';
  }

  /* ---------- Preview / done ---------- */
  function renderPreview() {
    paintTag($('bigTag'), true);
    $('previewLang').textContent = C.LANG_LABEL[effectiveWishLang()] || '';
    $('hangLabel').textContent = S.busy ? t('sending') : t('hangBtn');
    $('hangBtn').disabled = S.busy;
  }

  var ICON_INNER = {
    snow: '<path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M9.5 4.5 12 7l2.5-2.5M9.5 19.5 12 17l2.5 2.5"/>',
    star: '<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>',
    tree: '<path d="M12 3 6.5 10h3L5 16h14l-4.5-6h3zM12 16v4.5"/>',
    gift: '<path d="M4 10h16v10H4zM3 7h18v3H3zM12 7v13M12 7c-1.5-3-5-3.5-5-1.5S10 7 12 7zm0 0c1.5-3 5-3.5 5-1.5S14 7 12 7z"/>'
  };

  function renderDone() {
    $('doneText').textContent = t('doneText', { reveal: CFG.REVEAL_DATE || '' });
    $('seeTreeBtn').href = C.url('index.html') + (S.site ? '?site=' + encodeURIComponent(S.site) : '');
    var pal = C.PALETTE[S.color] || C.PALETTE.cream;
    $('doneTagRect').setAttribute('fill', pal.bg);
    var icon = $('doneTagIcon');
    icon.setAttribute('stroke', pal.fg);
    icon.innerHTML = ICON_INNER[S.charm] || ICON_INNER.snow;
  }

  /* ---------- Auth ---------- */
  var sb = null;

  function handleSession(session) {
    if (!session || !session.user) {
      S.user = null;
      if (S.view === 'loading' || S.view === 'write' || S.view === 'preview') show('signin');
      return;
    }
    var email = session.user.email || '';
    if (!C.allowedEmail(email)) {
      S.user = null;
      setTimeout(function () { sb.auth.signOut(); }, 0);
      $('signinErr').textContent = t('errDomain', { domain: DOMAIN });
      show('signin');
      return;
    }
    var meta = session.user.user_metadata || {};
    var first = meta.given_name || String(meta.full_name || meta.name || '').split(' ')[0] || '';
    S.user = { email: email };
    if (!S.first && first) S.first = first;
    renderWho();
    if (S.view === 'loading' || S.view === 'signin' || S.view === 'code') show('write');
  }

  function startGoogle() {
    $('signinErr').textContent = '';
    if (C.demo) {
      handleDemoSignIn('you@' + DOMAIN, 'Aisyah');
      return;
    }
    var btn = $('googleBtn');
    btn.disabled = true;
    sb.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: window.location.origin + window.location.pathname,
        queryParams: { hd: DOMAIN, prompt: 'select_account' }
      }
    }).then(function (res) {
      if (res.error) throw res.error;
    }).catch(function (err) {
      console.error(err);
      btn.disabled = false;
      $('signinErr').textContent = t('errGeneric');
    });
  }

  function sendCode(e) {
    if (e) e.preventDefault();
    var email = $('email').value.trim().toLowerCase();
    $('signinErr').textContent = '';
    if (!C.allowedEmail(email)) {
      $('signinErr').textContent = t('errDomain', { domain: DOMAIN });
      $('email').focus();
      return;
    }
    S.email = email;
    $('codeLabel').textContent = t('codeLabel', { email: email });
    if (C.demo) { $('code').value = ''; show('code'); return; }
    var btn = $('sendCodeBtn');
    btn.disabled = true;
    sb.auth.signInWithOtp({ email: email, options: { shouldCreateUser: true } }).then(function (res) {
      btn.disabled = false;
      if (res.error) throw res.error;
      $('code').value = '';
      $('codeErr').textContent = '';
      show('code');
    }).catch(function (err) {
      console.error(err);
      btn.disabled = false;
      $('signinErr').textContent = t('errSend');
    });
  }

  function verifyCode(e) {
    if (e) e.preventDefault();
    var token = $('code').value.replace(/\D/g, '');
    $('codeErr').textContent = '';
    if (token.length !== 6) { $('codeErr').textContent = t('errCode'); $('code').focus(); return; }
    if (C.demo) { handleDemoSignIn(S.email, ''); return; }
    var btn = $('verifyBtn');
    btn.disabled = true;
    sb.auth.verifyOtp({ email: S.email, token: token, type: 'email' }).then(function (res) {
      btn.disabled = false;
      if (res.error) throw res.error;
      handleSession(res.data && res.data.session);
    }).catch(function (err) {
      console.error(err);
      btn.disabled = false;
      $('codeErr').textContent = t('errCode');
    });
  }

  function handleDemoSignIn(email, first) {
    S.user = { email: email };
    if (!S.first && first) S.first = first;
    C.storageSet('wt-demo-user', email);
    renderWho();
    show('write');
  }

  function signOut() {
    S.user = null;
    if (C.demo) { C.storageSet('wt-demo-user', ''); show('signin'); return; }
    sb.auth.signOut().finally(function () { show('signin'); });
  }

  /* ---------- Submit ---------- */
  function submit() {
    if (S.busy) return;
    var key = blockerKey();
    if (key) { S.triedPreview = true; show('write'); return; }
    if (CFG.SUBMISSIONS_OPEN === false) { $('submitErr').textContent = t('errClosed'); return; }

    var row = {
      message: S.text.trim().slice(0, MAX),
      display_mode: S.mode,
      first_name: S.mode === 'name' ? S.first.trim().slice(0, 40) : null,
      site: S.site,
      lang: effectiveWishLang(),
      tag_color: S.color,
      charm: S.charm,
      consent: true
    };

    $('submitErr').textContent = '';
    S.busy = true;
    renderPreview();

    var done = function () {
      S.busy = false;
      C.track('wish_submit', { site: row.site, lang: row.lang, mode: row.display_mode });
      show('done');
    };
    var fail = function (err) {
      console.error(err);
      S.busy = false;
      renderPreview();
      var msg = String((err && (err.message || err.details)) || '').toLowerCase();
      if (err && err.code === '42501') $('submitErr').textContent = t('errNotAllowed');
      else if (msg.indexOf('wish_limit') !== -1) $('submitErr').textContent = t('errLimit');
      else if (msg.indexOf('wishes_closed') !== -1) $('submitErr').textContent = t('errClosed');
      else $('submitErr').textContent = t('errSubmit');
    };

    if (C.demo) {
      try {
        var list = JSON.parse(C.storageGet('wt-demo-wishes') || '[]');
        list.push(Object.assign({ created_at: new Date().toISOString(), status: 'pending' }, row));
        C.storageSet('wt-demo-wishes', JSON.stringify(list));
      } catch (e) { /* ignore */ }
      setTimeout(done, 600);
      return;
    }

    sb.from('wishes').insert(row).then(function (res) {
      if (res.error) throw res.error;
      done();
    }).catch(fail);
  }

  function resetForAnother() {
    S.text = '';
    S.wishLangTouched = false;
    S.wishLang = null;
    S.triedPreview = false;
    show('write');
  }

  function share() {
    var url = new URL('wish.html', window.location.href).href;
    if (CFG.WISH_PAGE_URL) url = CFG.WISH_PAGE_URL;
    var btn = $('shareBtn');
    var mark = function () { btn.textContent = t('copied'); setTimeout(function () { btn.textContent = t('copyLink'); }, 2500); };
    if (navigator.share) {
      navigator.share({ title: 'TP Wish Tree', text: t('shareText'), url: url }).catch(function () { /* cancelled */ });
      C.track('wish_share', { method: 'native' });
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(mark, function () { window.prompt(t('copyLink'), url); });
    } else {
      window.prompt(t('copyLink'), url);
    }
    C.track('wish_share', { method: 'copy' });
  }

  /* ---------- Events ---------- */
  qsa('.langs button').forEach(function (b) {
    b.addEventListener('click', function () {
      S.lang = b.getAttribute('data-lang');
      C.storageSet('wt-lang', S.lang);
      applyLang();
    });
  });

  $('googleBtn').addEventListener('click', startGoogle);
  $('emailForm').addEventListener('submit', sendCode);
  $('codeForm').addEventListener('submit', verifyCode);
  $('code').addEventListener('input', function () {
    var v = $('code').value.replace(/\D/g, '').slice(0, 6);
    if ($('code').value !== v) $('code').value = v;
    if (v.length === 6) verifyCode();
  });
  $('resendBtn').addEventListener('click', function () { $('email').value = S.email; sendCode(); });
  $('changeEmailBtn').addEventListener('click', function () { show('signin'); $('email').focus(); });
  $('signOutBtn').addEventListener('click', signOut);

  qsa('.opt[data-color]').forEach(function (b) {
    b.addEventListener('click', function () { S.color = b.getAttribute('data-color'); renderWrite(); });
  });
  qsa('.opt[data-charm]').forEach(function (b) {
    b.addEventListener('click', function () { S.charm = b.getAttribute('data-charm'); renderWrite(); });
  });
  qsa('[data-starter]').forEach(function (b) {
    b.addEventListener('click', function () {
      S.text = t('seed_' + b.getAttribute('data-starter'));
      renderWrite();
      var ta = $('wishText');
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);
    });
  });
  $('wishText').addEventListener('input', function (e) {
    S.text = e.target.value.slice(0, MAX);
    renderWrite();
  });
  // "Written in": one button per language in config.js
  $('wlangSeg').innerHTML = C.LANGUAGES.map(function (l) {
    return '<button type="button" data-wlang="' + C.esc(l.code) + '" lang="' + C.esc(l.code) + '"' +
      (l.english && l.english !== l.label ? ' title="' + C.esc(l.english) + '"' : '') + '>' + C.esc(l.label) + '</button>';
  }).join('');
  $('wlangSeg').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button[data-wlang]') : null;
    if (!b) return;
    S.wishLang = b.getAttribute('data-wlang');
    S.wishLangTouched = true;
    renderWrite();
  });
  qsa('input[name="mode"]').forEach(function (r) {
    r.addEventListener('change', function () { if (r.checked) { S.mode = r.value; renderWrite(); } });
  });
  $('firstName').addEventListener('input', function (e) { S.first = e.target.value; renderWrite(); });
  $('siteSel').addEventListener('change', function (e) { S.site = e.target.value; C.storageSet('wt-site', S.site); renderWrite(); });
  $('consent').addEventListener('change', function (e) { S.consent = e.target.checked; renderWrite(); });

  $('toPreviewBtn').addEventListener('click', function () {
    var key = blockerKey();
    if (key) {
      S.triedPreview = true;
      renderWrite();
      var focusMap = { needText: 'wishText', needName: 'firstName', needSite: 'siteSel', needConsent: 'consent' };
      var f = $(focusMap[key]);
      if (f) f.focus();
      return;
    }
    show('preview');
  });
  $('backToWrite').addEventListener('click', function () { show('write'); });
  $('editBtn').addEventListener('click', function () { show('write'); });
  $('hangBtn').addEventListener('click', submit);
  $('shareBtn').addEventListener('click', share);
  $('anotherBtn').addEventListener('click', resetForAnother);

  /* ---------- Start ---------- */
  C.initGA();
  C.setLogo($('logo'));
  $('googleBlock').hidden = AUTH !== 'google';
  $('emailForm').hidden = AUTH !== 'email';
  if (C.demo) $('demoBar').hidden = false;
  applyLang();

  if (CFG.SUBMISSIONS_OPEN === false) {
    show('closed');
    return;
  }

  if (C.demo) {
    if (C.demoLoad('wt-demo-settings', {}).submissions_open === false) { show('closed'); return; }
    var demoUser = C.storageGet('wt-demo-user');
    if (demoUser) { S.user = { email: demoUser }; renderWho(); show('write'); }
    else show('signin');
    return;
  }

  try {
    sb = C.client();
  } catch (err) {
    console.error(err);
    show('signin');
    $('signinErr').textContent = t('errGeneric');
    return;
  }

  // The Wish Tree team can close new wishes from the approvals page
  sb.rpc('get_settings').then(function (res) {
    var st = res && Array.isArray(res.data) ? res.data[0] : res && res.data;
    return !(st && st.submissions_open === false);
  }, function () { return true; }).then(function (open) {
    if (!open) { show('closed'); return; }
    sb.auth.onAuthStateChange(function (event, session) {
      if (event === 'SIGNED_OUT') { S.user = null; renderWho(); return; }
      if (session) handleSession(session);
    });
    sb.auth.getSession().then(function (res) {
      var session = res && res.data ? res.data.session : null;
      if (session) handleSession(session);
      else if (S.view === 'loading') show('signin');
    }).catch(function (err) {
      console.error(err);
      show('signin');
    });
  });
})();
</script>
</body>
</html>
